[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonointent"
version = "0.1.0"
description = "Code and tooling for the SonoIntent ultrasound reasoning segmentation benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow"]

[project.optional-dependencies]
build = ["scipy"]
test = ["pytest"]

[project.scripts]
sonointent-eval = "sonointent.eval.evaluate:main"
sonointent-build-split = "sonointent.build.build_split:main"

[tool.setuptools.packages.find]
include = ["sonointent*"]
